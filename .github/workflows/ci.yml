name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server-test:
    name: Server — Type-check & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type-check
        working-directory: server
        run: npm run type-check

      - name: Run tests
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-key-32-chars-minimum!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-minimum!
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
        run: npm test -- --ci --coverage --coverageReporters=text-summary

  client-build:
    name: Client — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          REACT_APP_API_URL: http://localhost:4000
          CI: false
        run: npm run build
